name: Build plugin

on:
  push:
    branches: [ main, installers ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs can only read the repo unless they explicitly need more.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: -A x64
          - name: macOS
            os: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Linux
            os: ubuntu-24.04
            cmake_args: -DPOTATO_BUILD_HARNESS=ON -G Ninja

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libjack-jackd2-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Cache JUCE download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_deps
          key: juce-9.0.5-${{ runner.os }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Full plugin check + screenshot (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" build/potato_harness_artefacts/Release/potato_harness screenshot.png

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          A=build/PotatoEQ_artefacts/Release
          cp -R "$A/VST3/Potato EQ.vst3" dist/
          if [ -d "$A/AU/Potato EQ.component" ]; then cp -R "$A/AU/Potato EQ.component" dist/; fi
          if [ -f "$A/Standalone/Potato EQ.exe" ]; then cp "$A/Standalone/Potato EQ.exe" dist/; fi
          if [ -d "$A/Standalone/Potato EQ.app" ]; then cp -R "$A/Standalone/Potato EQ.app" dist/; fi
          if [ -f screenshot.png ]; then cp screenshot.png dist/; fi
          cp INSTALL.txt dist/

      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(sed -n 's/^project(PotatoEQ VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=${{ steps.ver.outputs.v }}" installer\windows\PotatoEQ.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: macOS installer
        if: runner.os == 'macOS'
        run: |
          installer/mac/build-pkg.sh "${{ steps.ver.outputs.v }}"
          pkgutil --payload-files installers/*.pkg | head -20

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PotatoEQ-${{ matrix.name }}
          path: dist

      - name: Installer checksum
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd installers
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          for f in *; do $sum "$f" >> SHA256SUMS.txt; done
          cat SHA256SUMS.txt

      - name: Upload installer
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PotatoEQ-${{ matrix.name }}-Installer
          path: installers

  release:
    # Every successful build of main is published as a GitHub Release, so the plugin is one click away.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only the release job may publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CMakeLists.txt
      - name: Release name
        id: rel
        run: |
          v=$(sed -n 's/^project(PotatoEQ VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then t="${GITHUB_REF_NAME}"; else t="v${v}-build.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          echo "name=Potato EQ ${t#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Zip plugin folders, keep installers as-is
        run: |
          cd artifacts
          for d in */; do case "$d" in *-Installer/) for f in "$d"*; do case "$f" in *SHA256SUMS.txt) cat "$f" >> SHA256SUMS.txt ;; *) mv "$f" . ;; esac; done ;; *) (cd "$d" && zip -qr "../${d%/}.zip" .) ;; esac; done
          sha256sum *.zip >> SHA256SUMS.txt
          ls -la; cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows (FL Studio, Ableton, ...):** download `PotatoEQ-Windows.zip`, unzip it, and copy the
            `Potato EQ.vst3` folder into `C:\Program Files\Common Files\VST3`. Then rescan plugins in your DAW.
            **Mac:** `PotatoEQ-macOS.zip` (VST3 + AU), see INSTALL.txt inside.
            Installers (unsigned) and SHA256 checksums are attached too.
          files: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.pkg
            artifacts/SHA256SUMS.txt
